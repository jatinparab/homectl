name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate VERSION
        run: |
          V=$(head -n1 VERSION | tr -d '\n\r')
          echo "VERSION: $V"
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be X.Y.Z (no leading v, no prerelease/build suffix), got: $V"
            exit 1
          fi

  go-test:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test ./...

  web-build:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web && npm ci && npm run build

