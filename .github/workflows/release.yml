name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current VERSION
        id: current
        run: |
          V=$(head -n1 VERSION | tr -d '\n\r')
          echo "value=$V" >> $GITHUB_OUTPUT
          echo "Current: $V"

      - name: Validate current VERSION
        run: |
          if ! echo "${{ steps.current.outputs.value }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be X.Y.Z, got: ${{ steps.current.outputs.value }}"
            exit 1
          fi

      - name: Compute next version
        id: next
        run: |
          IFS=. read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.value }}"
          case "${{ github.event.inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "value=$NEXT" >> $GITHUB_OUTPUT
          echo "tag=v$NEXT" >> $GITHUB_OUTPUT
          echo "Next: $NEXT (tag v$NEXT)"

      - name: Check tag does not already exist
        run: |
          if git rev-parse "${{ steps.next.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.next.outputs.tag }} already exists"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Build web UI
        run: cd web && npm ci && npm run build

      - name: Bump versions and commit
        run: |
          echo "${{ steps.next.outputs.value }}" > VERSION
          cd web
          jq --arg v "${{ steps.next.outputs.value }}" '.version=$v' package.json > package.json.tmp && mv package.json.tmp package.json
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION web/package.json
          git commit -m "chore: bump version to ${{ steps.next.outputs.value }} [skip ci]"
          git tag "${{ steps.next.outputs.tag }}"
          git push origin main --tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.manager
          build-args: |
            CROWDSEC_VERSION=v1.8.2
            HOMECTL_VERSION=${{ steps.next.outputs.value }}
            HOMECTL_COMMIT=${{ github.sha }}
            HOMECTL_BUILD_DATE=${{ github.event.head_commit.timestamp }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jatinparab/homectl/manager:${{ steps.next.outputs.tag }}
            ghcr.io/jatinparab/homectl/manager:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          build-args: |
            HOMECTL_VERSION=${{ steps.next.outputs.value }}
            HOMECTL_COMMIT=${{ github.sha }}
            HOMECTL_BUILD_DATE=${{ github.event.head_commit.timestamp }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jatinparab/homectl/agent:${{ steps.next.outputs.tag }}
            ghcr.io/jatinparab/homectl/agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
