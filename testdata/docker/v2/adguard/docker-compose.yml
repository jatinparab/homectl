services:
  adguard:
    image: adguard/adguardhome
    # user: $LABCTL_USER
    env_file:
      - .env
    volumes:
      - ${APPDATA?:'environment variable not set'}/adguard/work:/opt/adguardhome/work
      - ${APPDATA?:'environment variable not set'}/adguard/conf:/opt/adguardhome/conf
    ports:
      - 3000:3000
      - 53:53/udp
      # - 53:53/tcp
      # - 853:853/tcp
      # - 784:784/udp
      # - 853:853/udp
      # - 5443:5443/tcp
      # - 5443:5443/udp