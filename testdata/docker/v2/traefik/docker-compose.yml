services:
  traefik:
    image: traefik:v3.5
    # network_mode: host
    command:
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/labctl/traefik"
      # Web entrypoint
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--entrypoints.websecure.http.tls.domains[0].main=sulphurgfx.com"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.new.sulphurgfx.com"
      - "--entrypoints.websecure.forwardedHeaders.insecure"
      
      - "--certificatesresolvers.letsencrypt.acme.email=jatinparab98@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/letsencrypt.json"
      - "--certificatesresolvers.letsencrypt.acme.dnsChallenge.resolvers=1.1.1.1:53"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      # - "--certificatesresolvers.letsencrypt.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--serversTransport.forwardingTimeouts.idleConnTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0s"
      - "--log.level=DEBUG"
      # TODO: Inspect more options from original implementation
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
      # - "53:53/udp"
      # - "53:53/tcp"
      # For dashboard
    volumes:
      - ${APPDATA:?'environment variable not set'}/traefik/data:/data
      - ${APPDATA:?'environment variable not set'}/traefik/config:/etc/labctl/traefik
    depends_on:
      - init-letsencrypt
  init-letsencrypt:
    image: busybox:latest
    command: ["sh", "-c", "touch /data/letsencrypt.json; chmod -v 600 /data/letsencrypt.json"]
    volumes:
      - "${APPDATA:?'environment variable not set'}/traefik/data:/data"