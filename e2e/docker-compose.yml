networks:
  e2e:
    driver: bridge

services:
  manager:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.manager
    hostname: manager
    networks:
      - e2e
    ports:
      - "1338:1338"
      - "1339:1339"
    volumes:
      - ./apps:/repo/docker/v2
    environment:
      - HOMECTL_REPO_DIR=/repo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1338/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  agent-1:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.agent
    hostname: e2e-node-1
    privileged: true
    networks:
      - e2e
    environment:
      - HOMECTL_AGENT_NAME=e2e-node-1
      - HOMECTL_MANAGER_URL=http://manager:1338
      - HOMECTL_DOCKER_ROOT_DIR=/docker
      - HOMECTL_APPDATA_DIR=/appdata
      - HOMECTL_USER=root
    depends_on:
      manager:
        condition: service_healthy

  agent-2:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.agent
    hostname: e2e-node-2
    privileged: true
    networks:
      - e2e
    environment:
      - HOMECTL_AGENT_NAME=e2e-node-2
      - HOMECTL_MANAGER_URL=http://manager:1338
      - HOMECTL_DOCKER_ROOT_DIR=/docker
      - HOMECTL_APPDATA_DIR=/appdata
      - HOMECTL_USER=root
    depends_on:
      manager:
        condition: service_healthy

  agent-3:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.agent
    hostname: e2e-node-3
    privileged: true
    networks:
      - e2e
    environment:
      - HOMECTL_AGENT_NAME=e2e-node-3
      - HOMECTL_MANAGER_URL=http://manager:1338
      - HOMECTL_DOCKER_ROOT_DIR=/docker
      - HOMECTL_APPDATA_DIR=/appdata
      - HOMECTL_USER=root
    depends_on:
      manager:
        condition: service_healthy
