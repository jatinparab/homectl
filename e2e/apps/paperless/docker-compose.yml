services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    environment:
      - PAPERLESS_REDIS=redis://broker:6379
      - PAPERLESS_DBENGINE=sqlite
      - PAPERLESS_SECRET_KEY=e2e-secret-key-not-for-production
      - PAPERLESS_TIME_ZONE=UTC
    ports:
      - "8000:8000"
    volumes:
      - ${APPDATA}/paperless/data:/usr/src/paperless/data
      - ${APPDATA}/paperless/media:/usr/src/paperless/media
      - ${APPDATA}/paperless/export:/usr/src/paperless/export
      - ${APPDATA}/paperless/consume:/usr/src/paperless/consume
    depends_on:
      - broker
    restart: unless-stopped

  broker:
    image: redis:7-alpine
    restart: unless-stopped
