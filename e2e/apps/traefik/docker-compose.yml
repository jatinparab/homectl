services:
  traefik:
    image: traefik:v3.5
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--ping=true"
      - "--log.level=INFO"
    ports:
      - "8080:8080"
      - "80:80"
    volumes:
      - ${APPDATA}/traefik/config:/etc/traefik/dynamic:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
