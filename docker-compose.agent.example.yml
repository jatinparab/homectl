services:
  agent:
    image: homectl/agent:latest
    container_name: homectl-agent
    restart: unless-stopped
    environment:
      HOMECTL_AGENT_NAME: node-1
      HOMECTL_JOIN_TOKEN: change-me
      HOMECTL_MANAGER_URL: https://homectl.your-domain.example
      HOMECTL_DOCKER_ROOT_DIR: /opt/homectl/docker
      HOMECTL_APPDATA_DIR: /opt/homectl/appdata
      HOMECTL_USER: root
      HOMECTL_COMPOSE_EXTRA_ARGS: ""
      CADDY_ACME_EMAIL: you@example.com
      CLOUDFLARE_API_TOKEN: change-me
      RESTIC_REPOSITORY: s3:https://s3.example.com/bucket/path
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "51844:51844/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/homectl:/opt/homectl
